<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DNS looks up a website address</title><desc id="desc">A website name is sent to DNS and returned as an IP address.</desc><rect width="640" height="360" rx="28" fill="#f8fafc"/><g fill="#fff" stroke="#94a3b8" stroke-width="3"><rect x="72" y="128" width="162" height="86" rx="14"/><rect x="406" y="128" width="162" height="86" rx="14"/></g><circle cx="320" cy="171" r="58" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/><g fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"><path d="M244 150h38M358 150h38M396 194h-38M282 194h-38"/><path d="m266 138 16 12-16 12M374 138-390 150l16 12" transform="translate(0 0)"/></g><g fill="#334155" font-family="Arial, sans-serif" text-anchor="middle"><text x="153" y="164" font-size="17" font-weight="700">example.com</text><text x="153" y="188" font-size="14">website name</text><text x="320" y="177" font-size="18" font-weight="700">DNS</text><text x="487" y="164" font-size="17" font-weight="700">203.0.113.5</text><text x="487" y="188" font-size="14">IP address</text><text x="320" y="290" font-size="17">DNS is the internet's phone book.</text></g></svg>
