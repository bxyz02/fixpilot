<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Safe power path</title><desc id="desc">Electricity travels from an outlet through a power supply to a device.</desc><rect width="640" height="360" rx="28" fill="#f8fafc"/><g fill="#fff" stroke="#94a3b8" stroke-width="4"><rect x="71" y="117" width="82" height="115" rx="12"/><rect x="264" y="108" width="126" height="133" rx="15"/><rect x="504" y="102" width="68" height="148" rx="12"/></g><path d="M111 145v25M133 145v25M153 174h111M390 174h114" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/><path d="m221 160 26 14-26 14M459 160l26 14-26 14" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/><g fill="#334155" font-family="Arial, sans-serif" text-anchor="middle"><text x="112" y="261" font-size="15">Outlet</text><text x="327" y="267" font-size="16" font-weight="700">Power supply</text><text x="538" y="278" font-size="15">Device</text><text x="320" y="326" font-size="17">Steady power helps devices work reliably.</text></g></svg>
