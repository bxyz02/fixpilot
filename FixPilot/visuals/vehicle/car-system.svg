<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Main car systems</title><desc id="desc">A simple car diagram points to the battery, engine, cooling and brakes.</desc><rect width="640" height="360" rx="28" fill="#f8fafc"/><path d="M120 232h394l-26-78c-6-19-24-32-45-32H226c-20 0-38 12-45 31l-28 79Z" fill="#fff" stroke="#6366f1" stroke-width="4"/><circle cx="210" cy="239" r="34" fill="#eef2ff" stroke="#475569" stroke-width="4"/><circle cx="435" cy="239" r="34" fill="#eef2ff" stroke="#475569" stroke-width="4"/><rect x="254" y="153" width="94" height="53" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/><rect x="165" y="168" width="45" height="34" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><path d="M381 153c16 13 16 38 0 51" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/><g fill="#334155" font-family="Arial, sans-serif" text-anchor="middle"><text x="187" y="151" font-size="14">Battery</text><text x="301" y="187" font-size="15" font-weight="700">Engine</text><text x="422" y="142" font-size="14">Cooling</text><text x="210" y="300" font-size="14">Brakes</text><text x="435" y="300" font-size="14">Brakes</text><text x="320" y="333" font-size="17">Different warning signs point to different systems.</text></g></svg>
